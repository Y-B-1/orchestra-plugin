# Publishes a GitHub release for the plugin version in plugins/orchestra/plugin.json. Runs in this repository
# only; it is not part of the installed plugin (plugins/orchestra).
#
# Two ways to start it:
#   - push a version tag v<version> that points at a commit on main;
#   - run it by hand from main (Actions tab, "Run workflow"): it creates the tag v<version> at that commit.
# Either way the tag must match the plugin version and docs/release-notes/v<version>.md must exist.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the full history and tags, so the checks below can run
      - name: Started from main, or from a tag on main
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "Run this workflow from main, not $GITHUB_REF."; exit 1; }
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it through a pull request first."; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: The tag matches the plugin version and has release notes
        run: |
          version=$(python -c "import json;print(json.load(open('plugins/orchestra/plugin.json'))['version'])")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$version"
            # A tag that already exists must be this very commit; the release is then published for it.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA" || { echo "Tag $tag already exists at a different commit."; exit 1; }
            fi
          else
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || { echo "Tag $tag does not match plugin version $version"; exit 1; }
          fi
          test -s "docs/release-notes/$tag.md" || { echo "Missing docs/release-notes/$tag.md"; exit 1; }
          { echo "VERSION=$version"; echo "TAG=$tag"; } >> "$GITHUB_ENV"
      - name: Build the archives
        run: python scripts/build_release.py --out dist
      - name: Release notes with checksums
        run: |
          cp "docs/release-notes/$TAG.md" notes.md
          printf '\nSHA-256:\n' >> notes.md
          while read -r sum name; do printf -- '- `%s` %s\n' "$name" "$sum" >> notes.md; done < dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" "dist/orchestra-$VERSION.tar.gz" "dist/orchestra-$VERSION.zip" \
            --title "Orchestra $VERSION" --notes-file notes.md "${target[@]}"
