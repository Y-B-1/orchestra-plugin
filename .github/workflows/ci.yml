# Checks the Orchestra plugin on every pull request and on main. Runs in this repository only;
# it is not part of the installed plugin (plugins/orchestra).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Agent files match the generator
        run: python plugins/orchestra/scripts/generate.py --check
      - name: Unit and integration tests
        run: python -m unittest discover -s tests

  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Unit and integration tests
        run: python -m unittest discover -s tests

  windows:
    name: Windows tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [engine, hooks, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - name: Unit and integration tests (UTF-8 mode, as the launcher runs them)
        shell: bash
        run: |
          case "${{ matrix.shard }}" in
            engine) mods="test_engine" ;;
            hooks) mods="test_hooks" ;;
            rest) mods=$(cd tests && ls test_*.py | grep -v -e test_engine -e test_hooks | sed 's#\.py$##' | tr '\n' ' ') ;;
          esac
          PYTHONPATH=tests python -u -X utf8 -m unittest -v $mods 2>&1 | grep -v " ok$"

  plugin:
    name: Plugin validation and mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate --strict plugins/orchestra
          claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Mod tests
        run: claude plugin test plugins/orchestra
