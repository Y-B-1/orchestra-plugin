# Checks the Orchestra plugin on Linux, macOS and Windows. Runs only when started by hand (Actions, CI,
# Run workflow): every check runs locally first with scripts/check.sh. Runs in this repository only;
# it is not part of the installed plugin (plugins/orchestra).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Unit and integration tests
        run: python -m unittest discover -s tests

  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Unit and integration tests
        run: python -m unittest discover -s tests

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Git identity for the test repositories
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests

  plugin:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.306
      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate --strict plugins/orchestra
          claude plugin validate --strict .claude-plugin/marketplace.json
